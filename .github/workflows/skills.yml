name: Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_skills.py"
      - ".github/workflows/skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/validate_skills.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py skills

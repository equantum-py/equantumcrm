name: Prospect AI

on:
  pull_request:
    paths:
      - "services/prospect-ai/**"
      - "contracts/**"
      - ".github/workflows/prospect-ai.yml"
  push:
    branches: [main]
    paths:
      - "services/prospect-ai/**"
      - "contracts/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: services/prospect-ai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

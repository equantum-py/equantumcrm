# Local PostgreSQL for the CRM. Usage: docker compose -f infrastructure/compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_development
    ports:
      - "5432:5432"
    volumes:
      - crm_pg:/var/lib/postgresql/data
volumes:
  crm_pg:
